name: Build debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Fetch sherpa-onnx AAR
        run: |
          if [ -f scripts/fetch_sherpa.sh ]; then bash scripts/fetch_sherpa.sh; fi

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: voicelock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Attach APK to the "latest-debug" pre-release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VoiceLock-debug.apk
          gh release view latest-debug >/dev/null 2>&1 || \
            gh release create latest-debug --prerelease \
              --title "Latest debug build" \
              --notes "Debug APK built automatically from main. For sideloading and testing only."
          gh release upload latest-debug VoiceLock-debug.apk --clobber
